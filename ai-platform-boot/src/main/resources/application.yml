server:
  port: ${SERVER_PORT:8080}

ai:
  credential-encryption-key: ${AI_CREDENTIAL_ENCRYPTION_KEY:ukv6kNB4OSpUZrIV+oPyt75+2/NtqbK/KZjT/X8xS2g=}
  executor-core-pool-size: 4
  executor-max-pool-size: 16
  executor-queue-capacity: 200

file:
  storage:
    type: minio
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:ai-files}
    secure: ${MINIO_SECURE:false}
    presign-expire-seconds: ${MINIO_PRESIGN_EXPIRE_SECONDS:3600}
    max-file-size: ${FILE_MAX_SIZE:10485760}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf
      - text/plain
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document

app:
  datasource:
    postgresql:
      url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ai_chat}
      username: ${POSTGRES_USERNAME:ice}
      password: ${POSTGRES_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        initialization-fail-timeout: -1

spring:
  application:
    name: ai-platform
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:10MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:10MB}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:12345678}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1ms}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

sa-token:
  token-name: ${SA_TOKEN_NAME:satoken}
  timeout: ${SA_TOKEN_TIMEOUT:2592000}
  is-concurrent: true
  is-share: false
  token-style: uuid
  jwt-secret-key: ${SA_TOKEN_SIGNING_KEY:ice}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
